name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: [release, fallback, sanitizers]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          options=(-DCMAKE_BUILD_TYPE=Release)
          if [[ "${{ matrix.config }}" == fallback ]]; then
            options+=(-DKNUTH_FORCE_QUADMATH=ON)
          elif [[ "${{ matrix.config }}" == sanitizers ]]; then
            options=(-DCMAKE_BUILD_TYPE=Debug -DKNUTH_SANITIZERS=ON)
          fi
          cmake -S . -B build "${options[@]}"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Retain test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.config }}-${{ github.sha }}
          retention-days: 7
          path: build/Testing/Temporary/LastTest.log
  knl-cross-build:
    # Compile the KNL code path with GCC 14 without running KNL instructions
    # on a GitHub-hosted x86-64 runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 if needed
        run: |
          if ! command -v g++-14 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y g++-14
          fi
      - name: Configure KNL build
        run: |
          cmake -S . -B build-knl -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF -DKNUTH_ARCH=knl
          grep -Eq '^CMAKE_CXX_COMPILER:(FILEPATH|STRING)=.*/g[+][+]-14
      - name: Compile (do not execute KNL instructions)
        run: cmake --build build-knl --parallel 2
 build-knl/CMakeCache.txt
      - name: Compile (do not execute KNL instructions)
        run: cmake --build build-knl --parallel 2
